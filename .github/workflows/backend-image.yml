name: Build and push backend image

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

jobs:
  build:
    uses: necro-org/workflows/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: micar-api
      context: ./Backend
      dockerfile: ./Backend/src/Api/Dockerfile
